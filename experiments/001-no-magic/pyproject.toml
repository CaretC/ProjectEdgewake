
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewake-no-magic"
version = "0.1.0"
description = "File fragment classification experiment"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "matplotlib"
]

[tool.setuptools]
packages = [
    "scripts",
    "scripts.dataset",
    "scripts.analysis",
]
