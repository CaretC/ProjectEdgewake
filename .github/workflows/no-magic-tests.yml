name: No Magic - Tests

on:
  push:
    paths:
      - 'experiments/001-no-magic/**'
      - '.github/workflows/no-magic-tests.yml'

  pull_request:
    paths:
      - 'experiments/001-no-magic/**'
      - '.github/workflows/no-magic-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiments/001-no-magic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -t . \
            -p "test_*.py" \
            -v